<!doctype html><meta charset="utf-8">
<!-- Wallpaper ideas, same gold / copper / dark palette. Open with ?d=1..5 at 1920x1080:
     1 dunes at dusk, 2 relief arabesque, 3 black marble with gold veins, 4 orbiting gold rings, 5 silk ribbons. Static images. -->
<style>html,body{margin:0;background:#0b0907}canvas{display:block}</style>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
var c = document.getElementById('c'), g = c.getContext('2d'), W = 1920, H = 1080;
var D = +(location.search.match(/d=(\d)/) || [0, 1])[1], seed = 11;
function rnd() { seed = (seed * 16807) % 2147483647; return seed / 2147483647; }
function glow(x, y, r, rgb, a) { var q = g.createRadialGradient(x, y, 0, x, y, r); q.addColorStop(0, 'rgba(' + rgb + ',' + a + ')'); q.addColorStop(.45, 'rgba(' + rgb + ',' + a * .35 + ')'); q.addColorStop(1, 'rgba(' + rgb + ',0)'); g.fillStyle = q; g.fillRect(0, 0, W, H); }
function base(k) { g.fillStyle = '#0b0907'; g.fillRect(0, 0, W, H); glow(1600, -60, 1200, '224,178,92', .5 * k); glow(-100, 1160, 1100, '196,112,52', .42 * k); glow(900, 620, 900, '120,82,40', .22 * k); glow(120, 20, 800, '64,74,132', .16 * k); }
function finish(calm) { // calm centre for the UI, vignette, fine dust
  g.globalCompositeOperation = 'source-over';
  var c0 = g.createRadialGradient(W / 2, H * .46, 80, W / 2, H * .46, 780); c0.addColorStop(0, 'rgba(8,6,4,' + calm + ')'); c0.addColorStop(.6, 'rgba(8,6,4,' + calm * .55 + ')'); c0.addColorStop(1, 'rgba(8,6,4,0)'); g.fillStyle = c0; g.fillRect(0, 0, W, H);
  var v = g.createRadialGradient(W / 2, H * .52, H * .35, W / 2, H * .52, H * 1.02); v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(.62, 'rgba(0,0,0,.16)'); v.addColorStop(1, 'rgba(0,0,0,.6)'); g.fillStyle = v; g.fillRect(0, 0, W, H);
  for (var i = 0; i < 70; i++) { g.fillStyle = 'rgba(255,226,160,' + (.12 + rnd() * .4) + ')'; g.beginPath(); g.arc(rnd() * W, rnd() * H, .7 + rnd() * 1.8, 0, 7); g.fill(); }
}

if (D === 1) { // DUNES AT DUSK: a low gold sun and layered ridges with rim light
  base(.8);
  var sky = g.createLinearGradient(0, 0, 0, 700); sky.addColorStop(0, 'rgba(10,8,12,0)'); sky.addColorStop(.7, 'rgba(120,70,40,.28)'); sky.addColorStop(1, 'rgba(230,160,80,.5)'); g.fillStyle = sky; g.fillRect(0, 0, W, 760);
  var sun = g.createRadialGradient(1330, 560, 0, 1330, 560, 360); sun.addColorStop(0, 'rgba(255,236,190,.95)'); sun.addColorStop(.12, 'rgba(250,206,120,.8)'); sun.addColorStop(.4, 'rgba(224,150,70,.25)'); sun.addColorStop(1, 'rgba(224,150,70,0)'); g.fillStyle = sun; g.fillRect(0, 0, W, H);
  for (var L = 0; L < 6; L++) {
    var y0 = 600 + L * 78, amp = 36 + L * 12, ph = L * 1.7, sh = 1 - L * .14;
    g.beginPath(); g.moveTo(0, H);
    for (var x = 0; x <= W; x += 8) g.lineTo(x, y0 + Math.sin(x / (330 - L * 25) + ph) * amp + Math.sin(x / (120 + L * 20) + ph * 2) * amp * .22 - L * 6);
    g.lineTo(W, H); g.closePath();
    var f = g.createLinearGradient(0, y0 - 60, 0, y0 + 200); f.addColorStop(0, 'rgba(' + Math.round(88 * sh + 24) + ',' + Math.round(54 * sh + 14) + ',' + Math.round(30 * sh + 8) + ',1)'); f.addColorStop(1, 'rgba(14,10,8,1)'); g.fillStyle = f; g.fill();
    g.beginPath(); for (var x2 = 0; x2 <= W; x2 += 8) { var yy = y0 + Math.sin(x2 / (330 - L * 25) + ph) * amp + Math.sin(x2 / (120 + L * 20) + ph * 2) * amp * .22 - L * 6; x2 ? g.lineTo(x2, yy) : g.moveTo(x2, yy); }
    g.strokeStyle = 'rgba(255,214,140,' + (.5 - L * .07) + ')'; g.lineWidth = 2; g.stroke();
    g.save(); g.beginPath(); g.moveTo(0, H); for (var x4 = 0; x4 <= W; x4 += 8) g.lineTo(x4, y0 + Math.sin(x4 / (330 - L * 25) + ph) * amp + Math.sin(x4 / (120 + L * 20) + ph * 2) * amp * .22 - L * 6); g.lineTo(W, H); g.closePath(); g.clip();
    var lit = g.createRadialGradient(1330, y0 - 80, 0, 1330, y0 - 80, 1100); lit.addColorStop(0, 'rgba(255,190,110,' + (.30 - L * .035) + ')'); lit.addColorStop(1, 'rgba(255,190,110,0)'); g.fillStyle = lit; g.fillRect(0, y0 - 140, W, 520);
    var hz = g.createLinearGradient(0, y0 - 60, 0, y0 + 120); hz.addColorStop(0, 'rgba(240,170,90,0)'); hz.addColorStop(.35, 'rgba(240,170,90,.12)'); hz.addColorStop(1, 'rgba(240,170,90,0)'); g.fillStyle = hz; g.fillRect(0, y0 - 60, W, 180); g.restore();
  }
  finish(.5);
}
if (D === 2) { // RELIEF ARABESQUE: classic eight-point stars (two overlapping squares) on a square grid, embossed, strongest at the corners
  base(.7);
  var S = 170, cvs = document.createElement('canvas'); cvs.width = W; cvs.height = H; var p = cvs.getContext('2d');
  function sq(ctx, cx, cy, R, rot) { ctx.beginPath(); for (var i = 0; i < 4; i++) { var a = rot + i * Math.PI / 2; ctx.lineTo(cx + Math.cos(a) * R, cy + Math.sin(a) * R); } ctx.closePath(); ctx.stroke(); }
  function lattice(ctx, dx, dy, col, lw) {
    ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.lineJoin = 'miter';
    for (var y = -S; y < H + S; y += S) for (var x = -S; x < W + S; x += S) {
      var cx = x + dx, cy = y + dy, R = S / 2;           // star tips reach the neighbouring stars
      sq(ctx, cx, cy, R * .0 + R * .7071 * 1.0, Math.PI / 4); sq(ctx, cx, cy, R * .7071 * 1.0, 0);   // the two squares that make the star
      ctx.beginPath(); ctx.arc(cx, cy, R * .30, 0, 7); ctx.stroke();                                   // centre ring
      sq(ctx, cx, cy, R * .17, Math.PI / 4);
      ctx.beginPath(); ctx.moveTo(cx + R, cy); ctx.lineTo(cx + S - R, cy); ctx.moveTo(cx, cy + R); ctx.lineTo(cx, cy + S - R); ctx.stroke(); // links to neighbours
    }
  }
  lattice(p, 3, 4, 'rgba(0,0,0,.9)', 5);             // shadow side
  lattice(p, -1.5, -2, 'rgba(255,218,150,.6)', 2.4); // lit side
  lattice(p, 0, 0, 'rgba(126,84,42,.95)', 3);        // body
  p.globalCompositeOperation = 'destination-in'; // visible mostly toward the edges
  var m = p.createRadialGradient(W / 2, H / 2, 300, W / 2, H / 2, 1050); m.addColorStop(0, 'rgba(0,0,0,.07)'); m.addColorStop(.55, 'rgba(0,0,0,.4)'); m.addColorStop(1, 'rgba(0,0,0,1)'); p.fillStyle = m; p.fillRect(0, 0, W, H);
  g.drawImage(cvs, 0, 0); finish(.45);
}
if (D === 3) { // GOLDEN BOKEH: soft out-of-focus lights, kept toward the edges, with faint beams
  base(.8);
  g.globalCompositeOperation = 'lighter';
  [[1500, -40, 70], [1700, 120, 50], [1800, 420, 150], [1250, 60, 38], [1600, 700, 90], [1860, 900, 120], [1420, 1000, 60]].forEach(function (b) { disc(b[0], b[1], b[2]); });
  [[120, 150, 110], [330, 60, 46], [40, 520, 160], [210, 780, 80], [420, 980, 120], [90, 1000, 54], [560, 230, 34]].forEach(function (b) { disc(b[0], b[1], b[2]); });
  for (var i = 0; i < 26; i++) { var x = rnd() < .5 ? rnd() * 520 : 1400 + rnd() * 520, y = rnd() * H; disc(x, y, 10 + rnd() * 28, .55); }
  function disc(x, y, r, k) {
    k = k || 1; var q = g.createRadialGradient(x, y, 0, x, y, r);
    q.addColorStop(0, 'rgba(240,190,100,' + .10 * k + ')'); q.addColorStop(.78, 'rgba(240,190,100,' + .16 * k + ')'); q.addColorStop(.93, 'rgba(255,226,160,' + .34 * k + ')'); q.addColorStop(1, 'rgba(255,226,160,0)');
    g.fillStyle = q; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill();
  }
  [[1440, 0, -.2], [1740, 0, .12], [130, 0, .24]].forEach(function (b) { g.save(); g.translate(b[0], b[1]); g.rotate(b[2]); var f = g.createLinearGradient(0, 0, 0, 1300); f.addColorStop(0, 'rgba(255,226,160,.16)'); f.addColorStop(1, 'rgba(255,226,160,0)'); g.fillStyle = f; g.fillRect(-80, 0, 160, 1300); g.restore(); });
  g.globalCompositeOperation = 'source-over'; finish(.5);
}
if (D === 4) { // ORBITING GOLD RINGS: thin rings in perspective, far half dim and near half bright
  base(.75);
  function rings(cx, cy, n, r0, step, tilt, rot) {
    for (var i = 0; i < n; i++) {
      var r = r0 + i * step, ry = r * tilt, lw = 1.2 + (i % 3) * .9;
      g.save(); g.translate(cx, cy); g.rotate(rot);
      [['back', Math.PI, 2 * Math.PI, .22], ['front', 0, Math.PI, .95]].forEach(function (h) {
        g.beginPath(); g.ellipse(0, 0, r, ry, 0, h[1], h[2]); var gr = g.createLinearGradient(-r, 0, r, 0); gr.addColorStop(0, 'rgba(184,116,58,' + h[3] + ')'); gr.addColorStop(.5, 'rgba(250,214,140,' + h[3] + ')'); gr.addColorStop(1, 'rgba(184,116,58,' + h[3] + ')');
        g.strokeStyle = gr; g.lineWidth = lw; g.shadowColor = 'rgba(240,190,100,.55)'; g.shadowBlur = h[0] === 'front' ? 14 : 4; g.stroke(); g.shadowBlur = 0;
      });
      g.restore();
    }
  }
  rings(1560, 330, 13, 170, 46, .26, -.22); rings(260, 860, 11, 150, 44, .24, .2);
  g.globalCompositeOperation = 'lighter'; glow(1560, 330, 520, '230,184,98', .16); glow(260, 860, 460, '200,120,60', .14); finish(.5);
}
if (D === 5) { // SILK RIBBONS
  base(.7);
  function ribbon(y0, amp, wid, ph, a, hue) {
    g.beginPath();
    for (var x = -20; x <= W + 20; x += 10) g.lineTo(x, y0 + Math.sin(x / 520 + ph) * amp + Math.sin(x / 190 + ph * 2) * amp * .18 - x * .16);
    for (var x2 = W + 20; x2 >= -20; x2 -= 10) g.lineTo(x2, y0 + wid + Math.sin(x2 / 470 + ph + .6) * amp * .9 + Math.sin(x2 / 170 + ph * 2) * amp * .15 - x2 * .16);
    g.closePath();
    var f = g.createLinearGradient(0, y0 - 200, 0, y0 + wid + 260); f.addColorStop(0, 'rgba(' + hue + ',0)'); f.addColorStop(.35, 'rgba(' + hue + ',' + a + ')'); f.addColorStop(.6, 'rgba(255,230,170,' + a * .55 + ')'); f.addColorStop(1, 'rgba(' + hue + ',0)'); g.fillStyle = f; g.fill();
    g.beginPath(); for (var x3 = -20; x3 <= W + 20; x3 += 10) { var yy = y0 + Math.sin(x3 / 520 + ph) * amp + Math.sin(x3 / 190 + ph * 2) * amp * .18 - x3 * .16; x3 > -20 ? g.lineTo(x3, yy) : g.moveTo(x3, yy); }
    g.strokeStyle = 'rgba(255,224,160,' + a * .8 + ')'; g.lineWidth = 1.6; g.stroke();
  }
  g.globalCompositeOperation = 'lighter';
  ribbon(980, 110, 150, 0, .50, '200,128,64'); ribbon(930, 140, 90, 1.3, .44, '224,178,92'); ribbon(1080, 90, 230, 2.4, .40, '184,116,58'); ribbon(790, 150, 60, 3.4, .34, '224,178,92'); ribbon(1190, 120, 210, 4.5, .38, '200,128,64'); ribbon(700, 120, 40, 5.4, .24, '224,178,92'); ribbon(560, 90, 30, 6.1, .16, '224,178,92');
  g.globalCompositeOperation = 'source-over'; finish(.5);
}
</script>
